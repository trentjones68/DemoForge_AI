name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
      - run: npm install --global npm@11.9.0
      - run: uv python install
      - run: make install
      - run: make check
      - run: make build
      - name: Start dependencies and verify migrations
        run: |
          cp .env.example .env
          make db-up
          make migrate REVISION=0002
          uv run --locked alembic downgrade 0001
          make migrate REVISION=0002
          uv run --locked alembic current | grep -E '^0002( |$)'
          make test-integration
      - name: Smoke test production web and API
        run: |
          npm run start --workspace @demoforge/web -- --hostname 127.0.0.1 &
          web_pid=$!
          uv run --locked uvicorn demoforge_api.main:create_app --factory --app-dir services/api &
          api_pid=$!
          trap 'kill "$web_pid" "$api_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/ -o /dev/null
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health/live -o /dev/null
          make smoke
      - if: always()
        run: |
          if [ -f .env ]; then make db-down; fi

  supabase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: "2.80.0"
      - run: uv sync --locked
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify Supabase, planning and catalog browser flows, and migration rollback
        env:
          DEMOFORGE_BROWSER_TEST: "1"
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/supabase-status.json" "$RUNNER_TEMP/supabase-start.log"' EXIT
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
          supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          uv run --locked python tests/run_local_supabase.py "$RUNNER_TEMP/supabase-status.json"
      - if: always()
        run: supabase stop --no-backup
